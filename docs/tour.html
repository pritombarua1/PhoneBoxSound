<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneBoxSound: guided tour</title>
<style>
:root { --bg: #0a0e0c; --panel: #131a16; --line: #2b3a32; --text: #eef3f0; --muted: #a2afa8; --accent: #5fd08f; --accent2: #5ea8ff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

/* slow coloured light behind everything */
.glow { position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(80px); opacity: .26; }
.glow i { position: absolute; width: 46%; aspect-ratio: 1; border-radius: 50%; }
.glow i:nth-child(1) { background: #1f7a4d; left: 4%; top: 6%; animation: drift1 26s ease-in-out infinite alternate; }
.glow i:nth-child(2) { background: #1d4f8f; right: 2%; bottom: 0; animation: drift2 32s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(18%, 14%) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-16%, -12%) scale(.9); } }

.stage { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 34px; height: 100vh; padding: 30px 36px 70px; align-items: center; }
.pic { height: 100%; min-height: 0; display: grid; place-items: center; perspective: 1600px; }
.pic img { max-width: 100%; max-height: calc(100vh - 112px); border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 30px 80px #000b; object-fit: contain; }
.pic .tilt { width: 100%; max-height: 100%; display: grid; place-items: center; height: 100%; transform-style: preserve-3d; animation: settle var(--dur, 9s) cubic-bezier(.2, .7, .2, 1) both; }
.pic.phone img { border-radius: 36px; border: 7px solid #1d2622; }
.pic.phone .tilt { animation-name: settle-phone; }
@keyframes settle { 0% { opacity: 0; transform: rotateY(-16deg) rotateX(5deg) translateY(18px) scale(.95); } 9% { opacity: 1; } 22% { transform: rotateY(-5deg) rotateX(1.5deg) scale(1); } 100% { transform: rotateY(-2deg) rotateX(.5deg) scale(1.035); } }
@keyframes settle-phone { 0% { opacity: 0; transform: rotateY(24deg) rotateX(6deg) translateY(22px) scale(.92); } 9% { opacity: 1; } 22% { transform: rotateY(9deg) rotateX(2deg) scale(1); } 100% { transform: rotateY(5deg) rotateX(1deg) scale(1.03); } }

.say > * { animation: rise .6s cubic-bezier(.2, .7, .2, 1) both; }
.say > :nth-child(2) { animation-delay: .08s; } .say > :nth-child(3) { animation-delay: .16s; } .say > :nth-child(4) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

/* where this happens: on the PC, on the phone, or in the browser */
.where { display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; border: 2px solid var(--accent); color: var(--accent); background: #5fd08f1c; }
.where.phone { border-color: var(--accent2); color: var(--accent2); background: #5ea8ff1c; }
.where svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; animation: nod 2.4s ease-in-out infinite; }
@keyframes nod { 50% { transform: translateY(-2px) rotate(-4deg); } }
.where .dotp { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: ping 1.6s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 currentColor; } 100% { box-shadow: 0 0 0 10px transparent; } }

.ch { color: var(--muted); font-weight: 700; letter-spacing: .09em; text-transform: uppercase; font-size: 12.5px; margin-top: 16px; }
h1 { font-size: clamp(24px, 2.5vw, 36px); line-height: 1.15; margin: 6px 0 12px; letter-spacing: -.02em; }
p { font-size: clamp(15.5px, 1.3vw, 19px); color: #d6dfda; margin: 0; }
ol.steps { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
ol.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; font-size: clamp(15px, 1.2vw, 18px); opacity: .0; transform: translateX(14px); animation: step .5s cubic-bezier(.2, .7, .2, 1) forwards; animation-delay: var(--at, 0s); }
ol.steps li::before { content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--accent); color: #06130c; }
@keyframes step { to { opacity: 1; transform: none; } }
.n { color: var(--muted); font-size: 13px; margin-top: 16px; }

/* a drawn browser window, for steps that happen on the browser's own pages */
.mock { width: 100%; max-width: 760px; font-size: 19px; border-radius: 14px; border: 1px solid var(--line); background: #171d1a; box-shadow: 0 30px 80px #000b; overflow: hidden; position: relative; }
.mock .tabs { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #0f1412; }
.mock .tabs i { width: 11px; height: 11px; border-radius: 50%; background: #3a4841; } .mock .tabs b { margin-left: 10px; font-size: 13px; color: var(--muted); }
.mock .addr { margin: 10px 14px; padding: 10px 16px; border-radius: 999px; background: #0c100e; border: 1px solid var(--line); font: 18px ui-monospace, Consolas, monospace; white-space: nowrap; overflow: hidden; }
.mock .addr span { display: inline-block; overflow: hidden; vertical-align: bottom; white-space: nowrap; width: 0; animation: typing 1.6s steps(30) .5s forwards; border-right: 2px solid var(--accent); }
@keyframes typing { to { width: var(--w, 100%); } }
.mock .body { padding: 18px 20px 26px; display: grid; gap: 12px; min-height: 250px; align-content: start; }
.mock .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #1c2420; font-weight: 600; position: relative; }
.mock .item small { font-weight: 400; color: var(--muted); display: block; }
.mock .item.btn { justify-self: start; padding: 9px 16px; }
.mock .item .sw { margin-left: auto; width: 42px; height: 23px; border-radius: 999px; border: 2px solid var(--muted); position: relative; flex: none; }
.mock .item .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 13px; height: 13px; border-radius: 50%; background: var(--muted); }
.mock .item.hit { border-color: var(--accent); animation: hit 1.4s ease-in-out 2.6s infinite; }
.mock .item.hit .sw { animation: swon .3s 3.2s forwards; } .mock .item.hit .sw::after { animation: knob .3s 3.2s forwards; }
@keyframes hit { 50% { box-shadow: 0 0 0 6px #5fd08f44; } }
@keyframes swon { to { background: var(--accent); border-color: var(--accent); } } @keyframes knob { to { transform: translateX(19px); background: #06130c; } }
.mock .cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; z-index: 3; opacity: 0; transition: transform 1.1s cubic-bezier(.3, .7, .2, 1), opacity .3s; pointer-events: none; }
.mock .cursor svg { width: 22px; height: 22px; fill: #fff; stroke: #000; stroke-width: 1.2; filter: drop-shadow(0 2px 3px #0009); }

.bar { position: fixed; z-index: 2; left: 0; right: 0; bottom: 0; padding: 10px 36px 14px; display: flex; align-items: center; gap: 12px; background: linear-gradient(transparent, var(--bg) 45%); }
.prog { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; } .prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s; }
button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid #55695e; border-radius: 10px; padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); } button.on { background: var(--accent); color: #06130c; border-color: var(--accent); font-weight: 700; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rec .ctl { display: none; }
@media (max-width: 820px) { html, body { overflow: auto; } .stage { grid-template-columns: 1fr; grid-template-rows: 46vh auto; height: auto; min-height: 100vh; padding: 14px 16px 80px; gap: 14px; } }
@media (prefers-reduced-motion: reduce) { .pic .tilt, .glow i, .where svg { animation: none; } }
</style></head>
<body>
<div class="glow"><i></i><i></i></div>
<div class="stage"><div class="pic" id="pic"></div><div class="say" id="say"></div></div>
<div class="bar"><button class="ctl" id="prev" aria-label="Previous">&#9664;</button><button class="ctl" id="play">Pause</button><button class="ctl" id="next" aria-label="Next">&#9654;</button>
  <button class="ctl" id="voice">Voice off</button>
  <div class="prog"><i id="prog"></i></div>
  <select class="ctl" id="jump" aria-label="Chapter"><option>Start</option><option>Speakers</option><option>Media</option><option>Control the PC</option><option>Intercom</option><option>Security</option><option>Browser</option><option>Bedtime</option><option>Settings</option><option>Phone settings</option></select></div>
<script>
const S = [{"ch":"Start","img":"dashboard","title":"Start it with one double-click","text":"Double-click start.bat. The first time it fetches what is missing by itself (Python, its packages, the web app), then opens this dashboard at http://localhost:8080. Nothing is ever installed on a phone.","steps":["Double-click start.bat","Wait for the browser to open the dashboard","Leave the window open, or use the tray icon"],"where":"pc"},{"ch":"Start","img":"qr-themed","title":"Connect a phone","text":"Point the phone's camera at the QR code, or type the address and the room code. Use the secure (https) address: it gives the phone its own key, which the microphone and PC control need.","steps":["Open the phone's camera","Point it at the QR code","Tap the link that appears"],"where":"pc"},{"ch":"Start","img":"phone-join","title":"On the phone it is just a web page","text":"iPhone or Android, any modern browser. Add it to the home screen and it opens like an app.","steps":["Type the 4-digit room code","Tap Join","Optional: Share, then Add to Home Screen"],"where":"phone"},{"ch":"Start","img":"approval","title":"You decide who gets in","text":"With \"Approve new phones\" on, knowing the code is not enough: a new phone waits here until you press Approve. Deny turns it away, Block keeps its address out.","steps":["Open Devices on the PC","Find the waiting phone","Press Approve"],"where":"pc"},{"ch":"Start","img":"phone-waiting","title":"What the waiting phone sees","text":"It can do nothing at all until it is approved: no sound, no remote, no PC control.","steps":[],"where":"phone"},{"ch":"Speakers","img":"phone-speaker","title":"Every phone is a speaker","text":"The PC's sound plays on all phones at the same moment. Each phone has its own volume, channel (left, right, stereo), sound shape and quality. \"Remote mode\" keeps the controls but plays no sound on this phone.","steps":["Tap \"Play PC audio here\"","Set this phone's volume","Pick left, right or stereo"],"where":"phone"},{"ch":"Speakers","img":"devices","title":"Devices: one row per phone","text":"Rename a phone, set its volume, channel, zone and timing, see its connection quality and which system it runs. Verify its key, block it, or forget it. Blocked addresses sit at the top; Past devices keeps a record of phones that left.","steps":["Click a phone's name to rename it","Drag its volume and timing","Use Block or Forget to remove it"],"where":"pc"},{"ch":"Speakers","img":"pc-speaker","title":"The PC's own speakers, in step","text":"Phones play a moment later than the PC (the sync buffer). Switch this on and the PC's speakers or headphones are delayed by the same amount, so the room is one sound. Windows' default output must be a different device from the one you listen on.","steps":["Open Settings, then Sync","Pick the speakers you listen on","Switch \"PC speakers in step\" on"],"where":"pc"},{"ch":"Speakers","img":"presets","title":"Presets: one tap sets the room","text":"Music, Movie, Party, Night and Sync test set every phone's channel, loudness and buffer at once. Change them or restore the defaults.","steps":["Open Presets","Press Music, Movie, Party or Night"],"where":"pc"},{"ch":"Speakers","img":"phone-studio","title":"Manage speakers from a phone","text":"A phone with the \"Manage speakers\" permission can change every phone's volume, channel and timing, pause all, and start the bedtime timer.","steps":[],"where":"phone"},{"ch":"Speakers","img":"phone-host","title":"Play music from a phone","text":"With \"Host music\", audio files on a phone play on every phone, in place of the PC's sound.","steps":[],"where":"phone"},{"ch":"Media","img":"nowplaying","title":"Now Playing: one remote for everything","text":"Whatever plays on the PC shows here: browsers, Spotify, VLC, MPC-HC, mpv, PotPlayer and other Windows apps. Play, pause, skip, seek, volume and speed. Pick which player the remote controls.","steps":[],"where":"pc"},{"ch":"Media","img":"nowplaying-spotify","title":"Spotify, properly","text":"Link your Spotify account in Settings and you get the real queue, exact repeat (off, all, this song), shuffle, Liked Songs and your playlists. Spotify does not let other apps reorder or remove queue items.","steps":["Settings, Search: paste your Spotify app's ID","Press Connect and sign in to Spotify","Queue, likes and playlists appear here"],"where":"pc"},{"ch":"Media","img":"search","title":"Search and play","text":"Type a song or video: results from YouTube, Spotify and Apple Music come with pictures, and one tap plays it on the PC. Other services (Netflix, Prime and more) open as links.","steps":["Type a song or a video","Click a result to play it on the PC"],"where":"pc"},{"ch":"Media","img":"share","title":"Share what is playing","text":"A link and a QR code for the current song or video, with its picture, so anyone can open it on their own device.","steps":["Press the share button","Scan the QR code, or copy the link"],"where":"pc"},{"ch":"Media","img":"phone-remote","title":"The phone's Remote tab","text":"The same remote in your hand: cover, title, seek bar, play and skip, jump 10 seconds back or forward, volume of the player and of the PC. Swipe the cover left or right to skip.","steps":["Open the Remote tab","Use play, skip and the seek bar","Swipe the cover to change song"],"where":"phone"},{"ch":"Media","img":"phone-spotify","title":"Spotify on the phone","text":"Like, repeat, shuffle, the next songs and your playlists, all from the phone.","steps":[],"where":"phone"},{"ch":"Media","img":"phone-search","title":"Search on the phone","text":"Tap Search and the keyboard opens at once on a full screen of its own. Results are the only list on screen. Tap one to play it on the PC, or \"Play next\" to queue a Spotify song.","steps":["Tap Search: the keyboard opens","Type and pick a result","\"Play next\" queues a Spotify song"],"where":"phone"},{"ch":"Media","img":"phone-playlists","title":"Playlists","text":"Play one of your playlists, or save the current song into one. If the song is already in that playlist it asks first: add again, or replace so it is there once.","steps":["Tap \"Add this song to a playlist\"","Tap a playlist","If it is already there: Add again or Replace"],"where":"phone"},{"ch":"Media","img":"phone-players","title":"Several players at once","text":"When more than one thing is playing, choose which one the remote controls.","steps":[],"where":"phone"},{"ch":"Control the PC","img":"remote","title":"Who can control this PC","text":"One switch per phone and per ability. Everything that reaches into the PC is OFF until you switch it on: keyboard and mouse, clipboard, screen view, power, files, commands, hosting music, approving phones, shake to lock down. A legend under the table says what each one allows.","steps":["Open Remote on the PC","Find the phone's column","Switch on only what that phone should do"],"where":"pc"},{"ch":"Control the PC","img":"phone-touchpad","title":"Touchpad","text":"Needs \"Keyboard & mouse\". Move the pointer, tap to click, two fingers to scroll or right-click, tap-then-hold to drag. Speed and drag lock are under Pad options.","steps":["Remote tab, then PC","Slide a finger to move the pointer","Tap to click, two fingers to scroll"],"where":"phone"},{"ch":"Control the PC","img":"phone-autokeyboard","title":"The keyboard opens by itself","text":"Tap a text box on the PC and the phone's keyboard comes up; what you type goes to the PC key by key. If the iPhone keeps the keyboard down, the bar says \"Tap here to type\": one tap on it brings it up. The switch for this is under Pad options.","steps":["Move the pointer onto a text box","Tap: the keyboard comes up","Type; press Done when finished"],"where":"phone"},{"ch":"Control the PC","img":"phone-keys","title":"Keys and shortcuts","text":"Ctrl, Shift, Alt, Win, arrows, function keys, ready-made shortcuts and your own. In the type box, Enter starts a new line; Send (or Shift+Enter) types the whole text on the PC.","steps":["Write in the type box","Enter makes a new line","Press Send to type it on the PC"],"where":"phone"},{"ch":"Control the PC","img":"phone-screen","title":"See the PC's screen","text":"Needs \"Screen view\". The whole screen or only the active window, live, on its own connection so it never disturbs the sound. With the free video helper it plays as smooth video, up to 30 frames a second. Screen mode (Pad options) gives this phone the screen alone, at the best quality, with its sound just behind the picture; the other phones pause until it ends.","steps":["Switch \"Screen view\" on for the phone","On the phone, open Pad options","Choose whole screen or active window"],"where":"phone"},{"ch":"Control the PC","img":"phone-magnifier","title":"Magnifier","text":"A zoomed view that follows the pointer, for small buttons and text.","steps":[],"where":"phone"},{"ch":"Control the PC","img":"phone-clipboard","title":"Clipboard","text":"Needs \"Clipboard\". Read what was copied on the PC, or send text and pictures to the PC's clipboard.","steps":[],"where":"phone"},{"ch":"Control the PC","img":"phone-pc","title":"Files, commands and power","text":"Send files into the PC's share folder and download what is in it (nothing outside it). Press the command buttons you made in Settings. A phone can never create a command.","steps":[],"where":"phone"},{"ch":"Control the PC","img":"phone-power-confirm","title":"Power asks first","text":"Lock, sleep, restart and shut down each ask for confirmation, then count down so anyone at the PC can cancel.","steps":["Tap Lock, Sleep, Restart or Shut down","Confirm","Cancel during the countdown if needed"],"where":"phone"},{"ch":"Intercom","img":"intercom","title":"Intercom and announcements","text":"Talk between phones and the PC. Type an announcement and the PC speaks it on every phone, with a doorbell sound first if you like. Your own voice is never played back to you, so there is no echo.","steps":["Open Intercom","Type an announcement","Choose a sound and press Announce"],"where":"pc"},{"ch":"Intercom","img":"phone-intercom","title":"Intercom on the phone","text":"Hold to talk, to everyone or to one phone. The microphone only works on the secure address.","steps":["Open the Intercom tab","Hold the button and talk","Let go to stop"],"where":"phone"},{"ch":"Security","img":"locked","title":"A password for the dashboard","text":"Set a password and every setting is stored encrypted with it. The dashboard, and optionally every server start, asks for it. Without the password the stored file cannot be read or swapped for another.","steps":["Settings, Password: set a password","Choose whether to ask at every start","Type it here to open the dashboard"],"where":"pc"},{"ch":"Security","img":"lockdown","title":"Lockdown","text":"One button: phones keep playing, but none can control the PC, no new phone can join and the remote API is closed.","steps":["Press Lockdown at the top","Press it again to lift it"],"where":"pc"},{"ch":"Security","img":"phone-locked","title":"What phones see in lockdown","text":"PC controls show as locked on every phone until you lift it.","steps":[],"where":"phone"},{"ch":"Security","img":"guest-pass","title":"Guest pass","text":"A QR code for visitors: speaker only, for a few hours, then they are disconnected and their record removed. No remote, no intercom, no PC control.","steps":["Devices, then Guest pass","Pick how many hours","Let the visitor scan the code"],"where":"pc"},{"ch":"Security","img":"phone-approve","title":"Approve from a phone","text":"A phone with the \"Approve phones\" permission can let a waiting phone in or turn it away without going to the PC.","steps":[],"where":"phone"},{"ch":"Security","img":"security-digest","title":"Security digest","text":"Where things stand (password, strict security, lockdown, phones with their own key) and what happened in the last 30 days: denied attempts, blocks, lockdowns.","steps":[],"where":"pc"},{"ch":"Security","img":"activity","title":"Activity: a two-day record per phone","text":"Every tap and every request of each phone with millisecond times, matched to what the PC answered. The switch at the top turns recording off entirely; \"What is recorded?\" explains it. Erase one phone's record or all.","steps":["Open Activity","Pick a phone","Use the switch at the top to stop recording"],"where":"pc"},{"ch":"Security","img":"replay","title":"Replay, like a camera recording","text":"Play back what a phone's screen showed, moment by moment, with a timeline to jump along.","steps":["Press Replay on a moment","Drag the timeline","Close with the cross"],"where":"pc"},{"ch":"Browser","img":"extension","title":"The browser extension","text":"For Chrome, Edge and Firefox: per-tab control of videos and music, with the picture delayed to match the phones so lips stay in sync.","steps":["Settings, Player integrations","Press \"How to add it\"","Follow the steps for your browser"],"where":"pc"},{"ch":"Browser","img":"extension-approve","title":"Each browser asks once","text":"A browser with the extension shows up here and does nothing until you approve it.","steps":["Open the browser with the extension","Come back to the dashboard","Press Approve"],"where":"pc"},{"ch":"Bedtime","img":"bedtime","title":"Bedtime fade","text":"Pick a time: the sound fades out on every phone, and the PC can then lock, sleep or shut down.","steps":["Pick the time","Choose lock, sleep or shut down","Press Start"],"where":"pc"},{"ch":"Settings","img":"set-0","title":"Start with Windows","text":"On: PhoneBoxSound starts quietly when you sign in to Windows, with its icon in the tray. Off: it only runs when you start it.","steps":["Open Settings","Flip the first switch"],"where":"pc"},{"ch":"Settings","img":"set-1","title":"Appearance","text":"Dark, light or follow the system; five colour themes; interface size. Phones follow unless they choose their own.","steps":[],"where":"pc"},{"ch":"Settings","img":"set-2","title":"Commands","text":"Make buttons that run a program or script on this PC. Phones with the \"PC commands\" permission can press them, never create or change them.","steps":["Type a name and what to run","Press Add","Give a phone the \"PC commands\" permission"],"where":"pc"},{"ch":"Settings","img":"set-3","title":"Files","text":"The one folder phones with the \"Files\" permission can send to and download from.","steps":[],"where":"pc"},{"ch":"Settings","img":"set-4","title":"Pairing & network","text":"The room code (make a new one any time), the addresses phones use, and the port (changing it moves connected phones along). Switches: advertise as phoneboxsound.local, the secure server, the warning-free https address, Approve new phones, Lockdown, Strict security (PC controls only for phones that proved their key). Disconnect all phones is here too.","steps":["\"New code\" changes the room code","Type a port and press Move to change it","Flip Approve, Lockdown and Strict as needed"],"where":"pc"},{"ch":"Settings","img":"set-5","title":"Screen view","text":"How phones see this PC's screen. With the free video helper (one 80 MB download, offered here) the screen is sent as smooth video, up to 30 frames a second, encoded by the PC's own video chip, using a fraction of the Wi-Fi. Without it, or on older phones, it is sent as pictures. Either way the sound always comes first.","steps":["Open Settings, Screen view","Press Download the video helper (once)","Give a phone the Screen view permission"],"where":"pc"},{"ch":"Settings","img":"set-6","title":"Sync","text":"The PC's own speakers in step with the phones; a lighter stream for a phone on poor Wi-Fi (it also tells you to come closer); automatic buffer with its minimum and maximum; lip-sync for VLC, MPC-HC and mpv.","steps":[],"where":"pc"},{"ch":"Settings","img":"set-7","title":"Player integrations","text":"Browsers, Spotify and Windows apps work by themselves. VLC, MPC-HC and mpv get a one-click or one-line setup for full timeline control. The browser extension is offered here.","steps":[],"where":"pc"},{"ch":"Settings","img":"set-8","title":"Search","text":"Optional keys: a YouTube key (without one, search still works), and your Spotify app's ID to link your account for queue, likes and playlists.","steps":["Paste a YouTube key (optional)","Paste your Spotify app's ID","Press Connect"],"where":"pc"},{"ch":"Settings","img":"set-9","title":"Password & encrypted storage","text":"Set, change or remove the dashboard password, and choose whether it is asked at every server start.","steps":["Type a password twice","Press Set password","Keep it safe: it cannot be recovered"],"where":"pc"},{"ch":"Settings","img":"set-10","title":"API & automation","text":"A token and ready-made commands to control PhoneBoxSound from scripts or a smart-home hub, and webhooks that tell other programs when something happens.","steps":[],"where":"pc"},{"ch":"Settings","img":"set-11","title":"Diagnostics","text":"Versions, audio device and health at a glance. Export makes a report with no tokens or passwords in it, to attach to a bug report.","steps":[],"where":"pc"},{"ch":"Phone settings","img":"phone-more","title":"More: this phone's own settings","text":"Invite another phone with a QR code, choose this phone's theme and text size, fine-tune its timing, switch \"Shake to lock down\" on (three firm shakes lock the PC down, if the permission is given).","steps":["Open the More tab","Pick theme and text size","Show the QR code to invite a phone"],"where":"phone"},{"ch":"Phone settings","img":"phone-textsize","title":"Text size","text":"Make everything on the phone larger or smaller.","steps":[],"where":"phone"},{"ch":"Phone settings","img":"phone-speaker-light","title":"Light or dark, five themes","text":"Phones follow the PC's theme unless they choose their own. Switches, tabs and buttons keep a strong outline in every theme.","steps":[],"where":"phone"}];
// Runs inside docs/tour.html and docs/extension-install.html. `S` (the slides) is defined just above this.
// As a page: play, pause, step, jump to a chapter, and read aloud with the browser's own voice.
// While being recorded (?record): no buttons; each slide lasts as long as its spoken text (window.tourTimes),
// and the moment each one starts is kept in window.tourStarts so the voice can be laid under the picture.
const rec = new URLSearchParams(location.search).has("record");
if (rec) document.body.classList.add("rec");
const ICON = {
  pc: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20M9 16v4M15 16v4"/></svg>',
  phone: '<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  browser: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M6.5 6.5h.01M9.5 6.5h.01"/></svg>',
};
const WHERE = { pc: "On the PC", phone: "On the phone", browser: "In the browser" };
let i = -1, playing = !rec, timer = 0, started = 0, left = 0, voice = false, t0 = 0;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const time = (k) => (window.tourTimes && window.tourTimes[k]) || Math.max(5000, Math.min(16000, 3200 + 48 * (S[k].text.length + (S[k].steps || []).join(" ").length)));
window.tourStarts = [];

function mock(m) {
  return '<div class="mock"><div class="tabs"><i></i><i></i><i></i><b>' + esc(m.browser) + '</b></div>' +
    '<div class="addr"><span style="--w:' + (m.url.length + 1) + 'ch">' + esc(m.url) + '</span></div><div class="body">' +
    m.items.map((it) => '<div class="item' + (it.btn ? " btn" : "") + (it.hit ? " hit" : "") + '"><div>' + esc(it.label) + (it.note ? "<small>" + esc(it.note) + "</small>" : "") + "</div>" + (it.sw ? '<span class="sw"></span>' : "") + "</div>").join("") +
    '</div><div class="cursor"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10.5 19z"/></svg></div></div>';
}

function show(k) {
  i = Math.max(0, Math.min(S.length - 1, k));
  const s = S[i], dur = time(i);
  window.tourStarts[i] = performance.now() - t0;
  $("pic").className = "pic" + (s.where === "phone" ? " phone" : "");
  $("pic").innerHTML = '<div class="tilt" style="--dur:' + dur + 'ms">' + (s.mock ? mock(s.mock) : '<img alt="" src="screens/' + s.img + '.png">') + "</div>";
  // each step appears when the voice reaches it: the voice speaks at an even pace, so the place in the text gives the time
  const steps = s.steps || [], lens = steps.map((t) => t.length + 14), before = s.title.length + s.text.length + 20, all = before + lens.reduce((a, b) => a + b, 0);
  const at = (j) => ((dur - 1400) / 1000) * ((before + lens.slice(0, j).reduce((a, b) => a + b, 0)) / all);
  $("say").innerHTML = '<div class="where ' + s.where + '">' + ICON[s.where] + WHERE[s.where] + '<span class="dotp"></span></div>' +
    '<div class="ch">' + esc(s.ch) + "</div><h1>" + esc(s.title) + "</h1><p>" + esc(s.text) + "</p>" +
    (steps.length ? '<ol class="steps">' + steps.map((t, j) => '<li style="--at:' + at(j).toFixed(1) + 's">' + esc(t) + "</li>").join("") + "</ol>" : "") +
    '<div class="n">' + (i + 1) + " / " + S.length + "</div>";
  const hit = $("pic").querySelector(".item.hit"), cur = $("pic").querySelector(".cursor");
  if (hit && cur) setTimeout(() => { const a = hit.getBoundingClientRect(), b = hit.closest(".mock").getBoundingClientRect(); cur.style.opacity = "1"; cur.style.transform = "translate(" + (a.left - b.left + (hit.querySelector(".sw") ? a.width - 34 : Math.min(a.width - 30, 150))) + "px," + (a.top - b.top + a.height / 2) + "px)"; }, 1500);
  $("jump").value = s.ch; $("prog").style.width = ((i + 1) / S.length) * 100 + "%";
  left = dur; run(true);
}
function next() { if (i >= S.length - 1) { window.tourDone = true; playing = false; $("play").textContent = "Play again"; } else show(i + 1); }
function run(fresh) {
  clearTimeout(timer); if (window.speechSynthesis) speechSynthesis.cancel();
  if (!playing) return;
  started = performance.now();
  if (voice && !rec && window.speechSynthesis && fresh) {      // read aloud; the next slide waits for the end of the sentence
    const s = S[i], u = new SpeechSynthesisUtterance([s.title, s.text].concat((s.steps || []).map((t, j) => "Step " + (j + 1) + ". " + t)).join(". "));
    u.rate = 0.95; u.onend = () => { timer = setTimeout(next, 900); }; u.onerror = () => { timer = setTimeout(next, left); };
    return speechSynthesis.speak(u);
  }
  timer = setTimeout(next, left);
}
$("play").onclick = () => {
  if (i >= S.length - 1 && !playing) { playing = true; $("play").textContent = "Pause"; return show(0); }
  playing = !playing; $("play").textContent = playing ? "Pause" : "Play";
  if (playing) run(true); else { clearTimeout(timer); if (window.speechSynthesis) speechSynthesis.cancel(); left = Math.max(1200, left - (performance.now() - started)); }
};
$("prev").onclick = () => show(i - 1); $("next").onclick = () => show(i + 1);
$("voice").onclick = () => { voice = !voice; $("voice").classList.toggle("on", voice); $("voice").textContent = voice ? "Voice on" : "Voice off"; if (playing) run(true); };
if (!window.speechSynthesis) $("voice").style.display = "none";
$("jump").onchange = (e) => show(S.findIndex((s) => s.ch === e.target.value));
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") show(i + 1); else if (e.key === "ArrowLeft") show(i - 1); else if (e.key === " ") { e.preventDefault(); $("play").click(); } });
window.tourLength = () => S.reduce((a, s, k) => a + time(k), 0);
window.tourGo = () => { playing = true; t0 = performance.now(); show(0); };
const ready = Promise.all(S.filter((s) => s.img).map((s) => new Promise((ok) => { const im = new Image(); im.onload = im.onerror = ok; im.src = "screens/" + s.img + ".png"; })));
ready.then(() => { window.tourReady = true; if (!rec) window.tourGo(); });
</script>
</body></html>
