# Builds, tests and publishes PhoneBoxSound on GitHub's own Windows machines.
#
#   Publish a new version:  set the version in package.json, phoneboxsound/__init__.py and CITATION.cff,
#                           commit, then:  git tag v3.2.0 && git push origin v3.2.0
#   Try the build only:     Actions → Release → Run workflow (nothing is published)
#
# The browser extension goes to the stores with each release once their keys are added as repository
# secrets (Settings → Secrets and variables → Actions). A store without keys is skipped, and a store that
# refuses an upload never stops the release. See extension/README.md, "Automatic store updates".
#   Firefox (addons.mozilla.org):  AMO_JWT_ISSUER, AMO_JWT_SECRET
#   Chrome Web Store:              CWS_EXTENSION_ID, CWS_PUBLISHER_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   Microsoft Edge Add-ons:        EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY
#
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $want = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $py = (Select-String -Path phoneboxsound/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($pkg -ne $want -or $py -ne $want) { throw "Tag $want, but package.json says $pkg and __init__.py says $py" }

      - name: Install
        run: |
          npm ci --no-fund --no-audit
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-lock.txt

      - name: Test
        run: python -m pytest tests -q

      - name: Build
        run: |
          npm run package
          npm run package:extension

      - name: Gather the downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item release/PhoneBoxSound-win64.zip, release/PhoneBoxSound-extension-chrome.zip, release/PhoneBoxSound-extension-firefox.zip out/
          Copy-Item docs/media/tour.mp4 out/PhoneBoxSound-guided-tour.mp4
          Copy-Item docs/media/extension-install.mp4 out/PhoneBoxSound-extension-install.mp4
          Copy-Item docs/PhoneBoxSound-Guide.pdf out/
          Copy-Item .github/release-notes.md out/notes.md
          Get-ChildItem out | Format-Table Name, Length

      - name: Keep the build (also when nothing is published)
        uses: actions/upload-artifact@v7
        with:
          name: PhoneBoxSound-${{ github.ref_name }}
          path: out

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem out -Exclude notes.md | ForEach-Object { $_.FullName }
          $title = "PhoneBoxSound " + "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" @files --title $title --notes-file out/notes.md --latest

      - name: Extension to Firefox (addons.mozilla.org)
        if: startsWith(github.ref, 'refs/tags/v') && env.AMO_JWT_ISSUER != ''
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive release/PhoneBoxSound-extension-firefox.zip ext-firefox
          npx --yes web-ext@10 sign --channel listed --source-dir ext-firefox --artifacts-dir ext-signed `
            --api-key "${{ secrets.AMO_JWT_ISSUER }}" --api-secret "${{ secrets.AMO_JWT_SECRET }}" --approval-timeout 0

      - name: Extension to the Chrome Web Store
        if: startsWith(github.ref, 'refs/tags/v') && env.CWS_REFRESH_TOKEN != ''
        continue-on-error: true
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4 --source release/PhoneBoxSound-extension-chrome.zip

      - name: Extension to Microsoft Edge Add-ons
        if: startsWith(github.ref, 'refs/tags/v') && env.EDGE_API_KEY != ''
        continue-on-error: true
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: release/PhoneBoxSound-extension-chrome.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
